[package]
name = "asq"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bat = "0.26.1"
clap = { version = "4.6.1", features = ["derive"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
handlebars = "6.4.1"
open = "5.3.5"
reqwest = { version = "0.13.3", features = ["blocking", "socks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = "0.28.0"
strum_macros = "0.28.0"
termimad = "0.34.1"
urlencoding = "2.1.3"
yaml_serde = "0.10.4"
