[package]
name = "asq"
version = "1.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.5"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
dom_smoothie = "0.17.0"
ignore = "0.4.25"
iocraft = "0.8.3"
marcli = "0.2.0"
reqwest = { version = "0.13.3", features = ["blocking", "socks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
smol = "2.0.1"
spinners = "4.2.0"
strum = "0.28.0"
strum_macros = "0.28.0"
urlencoding = "2.1.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
